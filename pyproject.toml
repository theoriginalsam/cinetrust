[project]
name = "cinetrust"
version = "0.1.0"
description = "Farm-resistant, multi-source movie ratings for films in theatres, built on Databricks."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
databricks = ["databricks-sdk>=0.30", "databricks-connect>=15.4", "mlflow>=2.14"]
hf = ["transformers>=4.40", "torch>=2.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cinetrust"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"pipelines/*" = ["E402", "F821"]

[tool.ruff.lint.isort]
known-first-party = ["cinetrust", "data"]
